<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Range browser regression checks</title>
<!-- Build kmaterialize, then open in a browser. Wait for PASS or FAIL. -->
<link rel="stylesheet" href="../dist/css/materialize.css">
<form><div class="range-field"><label for="range-test">Test</label>
<input id="range-test" type="range" min="0" max="100" step="25" value="25" data-ticks style="width:300px">
</div></form>
<pre id="result">PENDING</pre>
<script src="../dist/js/materialize.js"></script>
<script>
(async()=>{
  const check=(value,message)=>{if(!value)throw Error(message)};
  const tick=()=>new Promise(resolve=>requestAnimationFrame(()=>setTimeout(resolve,50)));
  const input=document.querySelector('#range-test');
  const slider=M.Range.getInstance(input);
  const progress=()=>parseFloat(input.style.getPropertyValue('--range-progress'));
  const log=[];
  try {
    check(slider,'automatic initialization');
    check(getComputedStyle(input).height==='48px','48px input target');
    check(progress()===80,'initial fill includes thumb inset');
    check(input.parentElement.querySelectorAll('.range-ticks > span').length===5,'step ticks');
    input.value='100';input.dispatchEvent(new Event('input'));
    check(progress()===290 && slider.value.textContent==='100','input updates track and label');
    input.value='0';slider.update();check(progress()===10,'minimum fill');
    input.value='75';slider.update();input.form.reset();await tick();
    check(input.value==='25' && progress()===80,'form reset');
    input.min='-100';input.max='0';input.value='-25';await tick();
    check(progress()===220,'zero maximum and negative minimum');
    input.dir='rtl';await tick();
    check(parseFloat(slider.thumb.style.left)===80,'RTL indicator');
    check(getComputedStyle(input).getPropertyValue('--range-direction').trim()==='to left','RTL track');
    input.style.width='200px';await tick();
    check(progress()===145,'resize updates fill geometry');
    input.focus();input.dispatchEvent(new Event('input'));
    check(slider.thumb.classList.contains('active'),'keyboard focus shows label');
    input.disabled=true;await tick();
    check(!slider.thumb.classList.contains('active'),'disabled hides label');
    check(input.parentElement.querySelector('.range-ticks').classList.contains('is-disabled'),'disabled ticks');
    input.disabled=false;input.step='any';await tick();
    check(input.parentElement.querySelector('.range-ticks').children.length===0,'continuous has no ticks');
    input.step='.00001';await tick();
    check(input.parentElement.querySelector('.range-ticks').children.length<=101,'dense ticks bounded');
    log.push('initial fill, input, reset, zero max, RTL, resize, focus, disabled, tick density');
    const formatted=M.Range.init(input,{formatValue:value=>`<b>${value} units</b>`});
    check(input.parentElement.querySelectorAll('.thumb').length===1,'reinit no duplicate');
    check(!formatted.value.querySelector('b'),'formatting uses plain text');
    check(input.getAttribute('aria-valuetext').includes('units'),'accessible formatted value');
    M.Range.Init();check(M.Range.getInstance(input)===formatted,'global init preserves instance');
    formatted.destroy();
    check(!input.parentElement.querySelector('.thumb'),'destroy removes bubble');
    check(!input.parentElement.querySelector('.range-ticks'),'destroy removes ticks');
    check(!input.hasAttribute('aria-valuetext'),'destroy restores ARIA');
    check(!input.style.getPropertyValue('--range-progress'),'destroy restores style');
    input.value='-50';input.dispatchEvent(new Event('input'));await tick();
    check(!input.style.getPropertyValue('--range-progress'),'destroy removes listeners');
    log.push('safe formatting, reinit, idempotent initialization, cleanup');
    input.min='0';input.max='10';input.step='0.1';input.value='2.5';input.disabled=false;
    const editable=M.Range.init(input,{showInput:true,inputLabel:'Amount'});
    const control=input.closest('.range-control');
    const field=control.querySelector('input[type=number]');
    check(control.querySelectorAll('input[type=number]').length===1,'single slider has exactly one numeric field');
    check(control.firstElementChild.contains(field),'number is before track');
    check(field.value==='2.5','initial editable value');
    field.value='4.2';field.dispatchEvent(new Event('input',{bubbles:true}));
    check(input.value==='4.2','typing updates single handle');
    input.value='7.1';input.dispatchEvent(new Event('input',{bubbles:true}));
    check(field.value==='7.1','single handle updates field');
    field.value='99';field.dispatchEvent(new Event('input',{bubbles:true}));
    check(input.value==='10'&&field.value==='99','bound clamp preserves draft');
    field.dispatchEvent(new Event('change',{bubbles:true}));check(field.value==='10.0','commit normalizes with stable precision');
    field.value='';field.dispatchEvent(new Event('input',{bubbles:true}));
    check(input.value==='10','empty draft preserves value');
    field.dispatchEvent(new Event('blur'));check(field.value==='10.0','blur restores draft');
    input.value='3';editable.update();check(field.value==='3.0' && input.value==='3','decimal padding preserves native value');
    input.step='1e-2';input.value='3';editable.update();check(field.value==='3.00','scientific step precision');
    input.min='0.005';input.value='3.005';editable.update();check(field.value==='3.005','fractional minimum precision');
    input.min='0';input.step='any';input.value='3.1234';editable.update();check(field.value==='3.1234','continuous value precision preserved');
    input.step='0.1';
    input.setAttribute('value','2.5');input.form.reset();await tick();
    check(field.value==='2.5','reset updates numeric field');
    input.disabled=true;await tick();check(field.disabled,'disabled field');input.disabled=false;
    const replacement=M.Range.init(input,{showInput:true});
    check(document.querySelectorAll('.range-control-single').length===1,'single reinit does not nest wrappers');
    replacement.destroy();check(!document.querySelector('.range-control-single'),'single wrapper cleanup');
    check(input.parentElement.classList.contains('range-field'),'restore original input parent');
    log.push('single numeric field, bidirectional editing, drafts, reset, disabled, reinit and cleanup');
    document.querySelector('#result').textContent='PASS: '+log.join('; ');
  } catch(e) {document.querySelector('#result').textContent='FAIL: '+e.stack+'; '+log.join('; ')}
})();

</script>
</html>
